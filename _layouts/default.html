<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.author }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {%- if site.style == "pico" %}
    <link rel="stylesheet" href="{{ '/assets/css/pico.classless.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/pico-overrides.css' | relative_url }}">
    {%- else %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {%- endif %}
    {%- if page.mathjax %}
    <script>window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']] } };</script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {%- endif %}
  </head>
  <body>
    <main class="page">
      {{ content }}
      <footer class="site-footer">
        <p>Last updated {{ site.time | date: "%B %Y" }}.</p>
      </footer>
    </main>
  </body>
</html>
