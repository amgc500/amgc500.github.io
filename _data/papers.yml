# =============================================================================
# Publication list for people.bath.ac.uk-style homepage, driven by Jekyll.
#
# This file is the single source of truth for the "Papers and Preprints"
# section. Order here IS the order on the page (newest first, as you keep it) --
# nothing is sorted automatically, so preprints can sit above published work.
#
# SCHEMA (every field is optional except `title`):
#   title        The paper title (rendered without surrounding quotes -- the
#                template adds them, so don't include your own).
#   authors      Coauthor string, e.g. "With D. Hobson and J. Obloj". Omit for
#                solo papers.
#   journal      Journal / venue name, shown as the link text if `journal_url`
#                is given, otherwise as plain text.
#   journal_url  URL the journal name links to (DOI, publisher page, etc.).
#   open_access  true  -> appends " (Open Access)" after the journal name.
#   year         Publication year (or preprint year).
#   volume       Volume.
#   issue        Issue / number.
#   pages        Page range, e.g. "327-400".
#   note         FREE-TEXT / HTML, rendered verbatim at the end of the entry.
#                This is the flexible slot: copyright lines, "to appear",
#                errata, "the original publication is available at ...", etc.
#   links        A map of {type: url}. Recognised types render with tidy
#                labels, in this fixed order: pdf, arxiv, code, video, slides,
#                doi. To add a new type/label, edit _includes/paper.html once.
#
# Accented names can be typed directly in this UTF-8 file (Kaellblad -> Källblad,
# Obloj -> Obłój, Beiglboeck -> Beiglböck); no HTML entities needed.
# =============================================================================

